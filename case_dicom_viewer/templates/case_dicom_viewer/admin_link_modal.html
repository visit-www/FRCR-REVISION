{# Case DICOM Viewer - OneDrive link modal (admin) #}
<div class="modal fade" id="caseDicomLinkModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header" style="background: linear-gradient(135deg, #17a2b8 0%, #138496 100%); color: white;">
        <h5 class="modal-title"><i class="fas fa-cloud me-2"></i>Link OneDrive Image Stack</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small">Connect OneDrive and paste a share link to a folder containing image stacks (axial, sagittal, etc.).</p>
        <div class="mb-3">
          <label class="form-label">OneDrive Share Link</label>
          <input type="url" class="form-control" id="caseDicomShareLink" placeholder="https://1drv.ms/... or https://onedrive.live.com/...">
        </div>
        <p class="small text-muted">Not implemented yet. See docs/plans/CASE_DICOM_VIEWER_PLAN.md</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-info" id="caseDicomParseBtn" disabled>
          <i class="fas fa-link me-1"></i>Parse & Select
        </button>
      </div>
    </div>
  </div>
</div>
