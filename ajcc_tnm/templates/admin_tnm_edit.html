{% extends "base.html" %}

{% block mobile_breadcrumb %}
    <li class="breadcrumb-item active text-white" aria-current="page">
        <i class="fas fa-edit me-1"></i>Edit TNM Data
    </li>
{% endblock %}

{% block content %}
<div class="admin-dashboard-container container mt-5 mb-5">
    <!-- Breadcrumb Navigation -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/"><i class="fas fa-home"></i> Home</a></li>
            <li class="breadcrumb-item"><a href="/admin"><i class="fas fa-cog"></i> Admin</a></li>
            <li class="breadcrumb-item"><a href="/api/admin/tnm/management"><i class="fas fa-stethoscope"></i> TNM Management</a></li>
            <li class="breadcrumb-item active" aria-current="page"><i class="fas fa-edit"></i> Edit</li>
        </ol>
    </nav>

    <h1 class="mb-4"><i class="fas fa-edit"></i> Edit TNM Staging Data</h1>

    <div id="loadingIndicator" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div id="editContainer" style="display: none;">
        <!-- Disease Info -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0" id="diseaseName"></h5>
                <small id="yearInfo"></small>
            </div>
        </div>

        <!-- Section Navigation Tabs -->
        <ul class="nav nav-tabs mb-4" id="sectionTabs" role="tablist">
            <!-- Tabs will be populated by JavaScript -->
        </ul>

        <!-- Section Content -->
        <div class="tab-content" id="sectionContent">
            <!-- Content will be populated by JavaScript -->
        </div>

        <!-- Save Buttons -->
        <div class="card mt-4">
            <div class="card-body">
                <button class="btn btn-primary" id="saveCurrentBtn">
                    <i class="fas fa-save me-1"></i>Save Current Section
                </button>
                <button class="btn btn-success ms-2" id="saveAllBtn">
                    <i class="fas fa-save me-1"></i>Save All Sections
                </button>
                <span id="saveStatus" class="ms-3"></span>
            </div>
        </div>
    </div>
</div>

<!-- TinyMCE Script -->
<script src="{{ url_for('static', filename='tinymce.min.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const diseaseSiteId = {{ disease_site_id }};
    const year = {{ year }};
    let sections = [];
    let currentSection = 1;
    let editors = {};
    
    // Load all sections
    fetch(`/api/admin/tnm/edit/${diseaseSiteId}/${year}`)
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                sections = data.sections;
                document.getElementById('diseaseName').textContent = data.disease_name;
                document.getElementById('yearInfo').textContent = `Year: ${data.year}`;
                
                // Create tabs
                const tabsNav = document.getElementById('sectionTabs');
                const tabsContent = document.getElementById('sectionContent');
                
                sections.forEach((section, index) => {
                    const tabId = `section-${section.section_number}`;
                    const isActive = index === 0;
                    
                    // Tab button
                    const tabButton = document.createElement('li');
                    tabButton.className = 'nav-item';
                    tabButton.innerHTML = `
                        <button class="nav-link ${isActive ? 'active' : ''}" 
                                id="${tabId}-tab" 
                                data-bs-toggle="tab" 
                                data-bs-target="#${tabId}" 
                                type="button" 
                                role="tab"
                                data-section="${section.section_number}">
                            Section ${section.section_number}
                        </button>
                    `;
                    tabsNav.appendChild(tabButton);
                    
                    // Tab content
                    const tabPane = document.createElement('div');
                    tabPane.className = `tab-pane fade ${isActive ? 'show active' : ''}`;
                    tabPane.id = tabId;
                    tabPane.setAttribute('role', 'tabpanel');
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const cardHeader = document.createElement('div');
                    cardHeader.className = 'card-header';
                    const heading = document.createElement('h5');
                    heading.textContent = section.section_name;
                    cardHeader.appendChild(heading);
                    
                    const cardBody = document.createElement('div');
                    cardBody.className = 'card-body';
                    
                    const textarea = document.createElement('textarea');
                    textarea.id = `editor-${section.section_number}`;
                    textarea.className = 'form-control tinymce-editor';
                    textarea.rows = 20;
                    textarea.value = section.html_content || '';
                    
                    cardBody.appendChild(textarea);
                    card.appendChild(cardHeader);
                    card.appendChild(cardBody);
                    tabPane.appendChild(card);
                    tabsContent.appendChild(tabPane);
                });
                
                // Initialize TinyMCE for all editors after a short delay to ensure DOM is ready
                setTimeout(() => {
                    const editorPromises = sections.map(section => {
                        const editorId = `editor-${section.section_number}`;
                        const element = document.getElementById(editorId);
                        
                        if (!element) {
                            console.error(`Editor element not found: ${editorId}`);
                            return Promise.resolve(null);
                        }
                        
                        return tinymce.init({
                            selector: `#${editorId}`,
                            height: 500,
                            menubar: false,
                            plugins: 'code table lists link image',
                            toolbar: 'undo redo | formatselect | bold italic | alignleft aligncenter alignright | bullist numlist | table | link image | code',
                            content_style: 'body { font-family: Arial, sans-serif; font-size: 14px; }',
                            setup: function(editor) {
                                editor.on('init', function() {
                                    console.log(`TinyMCE initialized for ${editorId}`);
                                });
                            }
                        });
                    });
                    
                    Promise.all(editorPromises).then(() => {
                        console.log('All TinyMCE editors initialized');
                    }).catch(err => {
                        console.error('Error initializing TinyMCE:', err);
                    });
                }, 100);
                
                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('editContainer').style.display = 'block';
            }
        });
    
    // Save current section
    document.getElementById('saveCurrentBtn').addEventListener('click', function() {
        const activeTab = document.querySelector('#sectionTabs .nav-link.active');
        if (!activeTab) return;
        
        const sectionNumber = parseInt(activeTab.getAttribute('data-section'));
        const editor = tinymce.get(`editor-${sectionNumber}`);
        if (!editor) return;
        
        const htmlContent = editor.getContent();
        saveSection(sectionNumber, htmlContent);
    });
    
    // Save all sections
    document.getElementById('saveAllBtn').addEventListener('click', function() {
        const saveBtn = document.getElementById('saveAllBtn');
        const saveStatus = document.getElementById('saveStatus');
        
        saveBtn.disabled = true;
        saveStatus.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving all sections...';
        
        let promises = [];
        sections.forEach(section => {
            const editor = tinymce.get(`editor-${section.section_number}`);
            if (editor) {
                const htmlContent = editor.getContent();
                promises.push(
                    fetch(`/api/admin/tnm/edit/${diseaseSiteId}/${year}/${section.section_number}`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({html_content: htmlContent})
                    })
                );
            }
        });
        
        Promise.all(promises)
            .then(responses => Promise.all(responses.map(r => r.json())))
            .then(results => {
                const allSuccess = results.every(r => r.success);
                if (allSuccess) {
                    saveStatus.innerHTML = '<span class="text-success"><i class="fas fa-check"></i> All sections saved!</span>';
                } else {
                    saveStatus.innerHTML = '<span class="text-danger"><i class="fas fa-times"></i> Some sections failed to save</span>';
                }
                saveBtn.disabled = false;
                setTimeout(() => saveStatus.innerHTML = '', 3000);
            })
            .catch(err => {
                saveStatus.innerHTML = `<span class="text-danger"><i class="fas fa-times"></i> Error: ${err.message}</span>`;
                saveBtn.disabled = false;
            });
    });
    
    function saveSection(sectionNumber, htmlContent) {
        const saveStatus = document.getElementById('saveStatus');
        saveStatus.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
        
        fetch(`/api/admin/tnm/edit/${diseaseSiteId}/${year}/${sectionNumber}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({html_content: htmlContent})
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                saveStatus.innerHTML = `<span class="text-success"><i class="fas fa-check"></i> Section ${sectionNumber} saved!</span>`;
            } else {
                saveStatus.innerHTML = `<span class="text-danger"><i class="fas fa-times"></i> ${data.error}</span>`;
            }
            setTimeout(() => saveStatus.innerHTML = '', 3000);
        })
        .catch(err => {
            saveStatus.innerHTML = `<span class="text-danger"><i class="fas fa-times"></i> Error: ${err.message}</span>`;
        });
    }
});
</script>
{% endblock %}
