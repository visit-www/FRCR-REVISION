<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZSSC3PLZFN"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-ZSSC3PLZFN');
    </script>
    <title>RadInsights - Reset Password</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dx7b7chvn/image/upload/v1769503549/frcr-rev-logo-solid_wnltqf.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-primary: #e96304;
            --brand-neutral: #5E899E;
            --brand-bg: #fdfdfb;
            --brand-text-primary: #2c3e50;
            --brand-text-secondary: #5a6270;
        }

        body {
            background: linear-gradient(135deg, #f7fafc 0%, #e8f1f6 60%, var(--brand-bg) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--brand-text-primary);
            padding: 24px;
        }

        .reset-container {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 18px 50px rgba(44, 62, 80, 0.15);
            border: 1px solid rgba(44, 62, 80, 0.08);
            padding: 42px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-mark {
            width: 70px;
            height: 70px;
            margin-bottom: 15px;
            border-radius: 10px;
            object-fit: cover;
        }

        .header-section h2 {
            color: var(--brand-text-primary);
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .header-section p {
            color: var(--brand-text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            color: var(--brand-text-primary);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--brand-neutral);
            box-shadow: 0 0 0 0.2rem rgba(94, 137, 158, 0.2);
            outline: none;
        }

        .password-strength {
            margin-top: 8px;
            font-size: 12px;
        }

        .strength-meter {
            height: 4px;
            border-radius: 2px;
            background-color: #e0e0e0;
            overflow: hidden;
            margin-top: 5px;
        }

        .strength-bar {
            height: 100%;
            transition: all 0.3s ease;
            width: 0%;
        }

        .strength-weak {
            background-color: #d9534f;
        }

        .strength-medium {
            background-color: #f0ad4e;
            width: 50%;
        }

        .strength-strong {
            background-color: #5cb85c;
            width: 100%;
        }

        .strength-text {
            color: #666;
            margin-top: 4px;
        }

        .btn-reset {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--brand-primary), #c75002);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(233, 99, 4, 0.25);
            color: white;
        }

        .btn-reset:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .alert {
            border-radius: 8px;
            margin-bottom: 20px;
            border: none;
            padding: 12px 15px;
            font-size: 14px;
        }

        .alert-danger {
            background-color: #fee;
            color: #c00;
        }

        .alert-success {
            background-color: #efe;
            color: #060;
        }

        .spinner-border {
            width: 16px;
            height: 16px;
            margin-right: 8px;
        }

        .requirements {
            background-color: #f8f9fb;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            font-size: 13px;
        }

        .requirement {
            padding: 5px 0;
            color: #666;
        }

        .requirement.met {
            color: #5cb85c;
        }

        .requirement i {
            width: 20px;
            margin-right: 8px;
        }

        @media (max-width: 576px) {
            .reset-container {
                padding: 30px 20px;
            }
        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 44px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--brand-text-secondary);
            cursor: pointer;
            font-size: 16px;
            }

            .header-section h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <!-- Header Section -->
        <div class="header-section">
            <img src="https://res.cloudinary.com/dx7b7chvn/image/upload/v1769503548/frcr-rev-logo-transp_o2hmrq.png" alt="app-logo" class="logo-mark">
            <h2>Set New Password</h2>
            <p>Create a strong password for your account</p>
        </div>

        <!-- Alert Messages -->
        <div id="alertContainer"></div>

        <!-- Reset Form -->
        <form id="resetForm">
            <input type="hidden" id="token" value="{{ token }}">

            <div class="form-group">
                <label for="password" class="form-label">New Password</label>
                <div class="password-field">
                <input 
                    type="password" 
                    id="password" 
                    class="form-control" 
                    placeholder="Enter new password"
                    required
                    autocomplete="new-password"
                >
                    <button type="button" class="toggle-password" data-target="password" aria-label="Show password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="strength-meter">
                    <div id="strengthBar" class="strength-bar"></div>
                </div>
                <div class="strength-text" id="strengthText"></div>
            </div>

            <div class="requirements" id="requirements">
                <div class="requirement" id="req-length">
                    <i class="fas fa-square"></i>
                    <span>At least 8 characters</span>
                </div>
                <div class="requirement" id="req-upper">
                    <i class="fas fa-square"></i>
                    <span>At least one uppercase letter</span>
                </div>
                <div class="requirement" id="req-lower">
                    <i class="fas fa-square"></i>
                    <span>At least one lowercase letter</span>
                </div>
                <div class="requirement" id="req-number">
                    <i class="fas fa-square"></i>
                    <span>At least one number</span>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <div class="password-field">
                <input 
                    type="password" 
                    id="confirmPassword" 
                    class="form-control" 
                    placeholder="Confirm your password"
                    required
                    autocomplete="new-password"
                >
                    <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-reset" id="resetBtn">
                <span id="resetText">Reset Password</span>
            </button>
        </form>
    </div>

    <script>
        const resetForm = document.getElementById('resetForm');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const resetBtn = document.getElementById('resetBtn');
        const resetText = document.getElementById('resetText');
        const alertContainer = document.getElementById('alertContainer');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');

        // Toggle password visibility
        document.querySelectorAll('.toggle-password').forEach((btn) => {
            btn.addEventListener('click', () => {
                const targetId = btn.getAttribute('data-target');
                const input = document.getElementById(targetId);
                if (!input) return;
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                btn.innerHTML = isPassword ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
            });
        });

        // Password strength requirements
        const requirements = {
            'length': { regex: /.{8,}/, element: 'req-length' },
            'upper': { regex: /[A-Z]/, element: 'req-upper' },
            'lower': { regex: /[a-z]/, element: 'req-lower' },
            'number': { regex: /[0-9]/, element: 'req-number' }
        };

        // Check password strength
        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            let strength = 0;
            let metRequirements = 0;

            Object.entries(requirements).forEach(([key, value]) => {
                const element = document.getElementById(value.element);
                if (value.regex.test(password)) {
                    strength += 25;
                    metRequirements++;
                    element.classList.add('met');
                    element.querySelector('i').className = 'fas fa-check';
                } else {
                    element.classList.remove('met');
                    element.querySelector('i').className = 'fas fa-square';
                }
            });

            // Update strength bar
            strengthBar.style.width = strength + '%';
            strengthBar.className = 'strength-bar';
            if (strength <= 25) {
                strengthBar.classList.add('strength-weak');
                strengthText.textContent = 'Weak';
                strengthText.style.color = '#d9534f';
            } else if (strength <= 50) {
                strengthBar.classList.add('strength-medium');
                strengthText.textContent = 'Fair';
                strengthText.style.color = '#f0ad4e';
            } else if (strength < 100) {
                strengthBar.classList.add('strength-medium');
                strengthText.textContent = 'Good';
                strengthText.style.color = '#5cb85c';
            } else {
                strengthBar.classList.add('strength-strong');
                strengthText.textContent = 'Strong';
                strengthText.style.color = '#5cb85c';
            }
        });

        // Form submission
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const token = document.getElementById('token').value;

            // Clear previous alerts
            alertContainer.innerHTML = '';

            // Validation
            if (!password || !confirmPassword) {
                showAlert('Please fill in all fields', 'danger');
                return;
            }

            if (password.length < 8) {
                showAlert('Password must be at least 8 characters', 'danger');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'danger');
                return;
            }

            // Check all requirements are met
            let allMet = true;
            Object.values(requirements).forEach(value => {
                if (!document.getElementById(value.element).classList.contains('met')) {
                    allMet = false;
                }
            });

            if (!allMet) {
                showAlert('Password does not meet all requirements', 'danger');
                return;
            }

            // Disable button and show loading
            resetBtn.disabled = true;
            resetText.innerHTML = '<span class="spinner-border"></span>Resetting...';

            try {
                const response = await fetch('/auth/reset-password/' + token, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Password reset successful! Logging you in...', 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    showAlert(data.error || 'Failed to reset password', 'danger');
                    resetBtn.disabled = false;
                    resetText.innerHTML = 'Reset Password';
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Connection error. Please try again.', 'danger');
                resetBtn.disabled = false;
                resetText.innerHTML = 'Reset Password';
            }
        });

        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `
                <i class="fas ${type === 'danger' ? 'fa-circle-exclamation' : 'fa-check-circle'}"></i>
                ${message}
            `;
            alertContainer.appendChild(alertDiv);

            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.style.transition = 'opacity 0.3s ease';
                    alertDiv.style.opacity = '0';
                    setTimeout(() => alertDiv.remove(), 300);
                }, 3000);
            }
        }
    </script>
</body>
</html>
