<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication - RadInsights</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dx7b7chvn/image/upload/v1769022136/icon-192x192_zkqtvu.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-primary: #e96304;
            --brand-neutral: #5E899E;
            --brand-success: #a8d5ba;
            --brand-bg: #fdfdfb;
            --brand-text-primary: #2c3e50;
            --brand-text-secondary: #5a6270;
        }

        body {
            background: linear-gradient(135deg, #f7fafc 0%, #e8f1f6 60%, var(--brand-bg) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--brand-text-primary);
            padding: 24px;
        }

        .login-container {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 18px 50px rgba(44, 62, 80, 0.15);
            border: 1px solid rgba(44, 62, 80, 0.08);
            padding: 42px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-mark {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            border-radius: 12px;
            object-fit: cover;
        }

        .logo-section h1 {
            color: var(--brand-text-primary);
            font-size: 28px;
            font-weight: 500;
            margin: 0;
        }

        .logo-section p {
            color: var(--brand-text-secondary);
            font-size: 14px;
            margin: 5px 0 0 0;
        }

        .two-fa-icon {
            font-size: 48px;
            color: var(--brand-neutral);
            margin-bottom: 15px;
        }

        .form-group { margin-bottom: 20px; }

        .form-label {
            color: var(--brand-text-primary);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--brand-neutral);
            box-shadow: 0 0 0 0.2rem rgba(94, 137, 158, 0.2);
            outline: none;
        }

        .form-control::placeholder {
            color: #ccc;
            letter-spacing: 4px;
            font-size: 18px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--brand-primary), #c75002);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(233, 99, 4, 0.25);
            color: white;
        }

        .alert {
            border-radius: 8px;
            margin-bottom: 20px;
            border: none;
            padding: 12px 15px;
            font-size: 14px;
        }

        .alert-danger { background-color: #fee; color: #c00; }
        .alert-success { background-color: #efe; color: #060; }

        .spinner-border {
            width: 16px;
            height: 16px;
            margin-right: 8px;
        }

        .back-link {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }

        .back-link a {
            color: var(--brand-text-secondary);
            text-decoration: none;
        }

        .back-link a:hover { text-decoration: underline; }

        @media (max-width: 576px) {
            .login-container { padding: 30px 20px; border-radius: 10px; }
            .logo-section h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <i class="fas fa-shield-halved two-fa-icon"></i>
            <h1>Two-Factor Authentication</h1>
            <p>Enter the 6-digit code from your authenticator app</p>
        </div>

        <div id="alertContainer"></div>

        <form id="tfaForm">
            <div class="form-group">
                <label for="code" class="form-label">Verification Code</label>
                <input
                    type="text"
                    id="code"
                    class="form-control"
                    placeholder="000000"
                    maxlength="6"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    autocomplete="one-time-code"
                    autofocus
                    required
                >
            </div>

            <button type="submit" class="btn btn-login" id="verifyBtn">
                <span id="verifyText">Verify</span>
            </button>
        </form>

        <div class="text-center mt-2" style="font-size: 13px;">
            <a href="#" id="toggleBackupCode" style="color: var(--brand-text-secondary); text-decoration: none;">
                Lost your authenticator? Use a backup code
            </a>
        </div>

        <div class="back-link">
            <a href="/auth/login"><i class="fas fa-arrow-left"></i> Back to login</a>
        </div>
    </div>

    <script>
        const tfaForm = document.getElementById('tfaForm');
        const codeInput = document.getElementById('code');
        const verifyBtn = document.getElementById('verifyBtn');
        const verifyText = document.getElementById('verifyText');
        const alertContainer = document.getElementById('alertContainer');
        const toggleLink = document.getElementById('toggleBackupCode');
        const codeLabel = document.querySelector('.form-label');
        const subtitleP = document.querySelector('.logo-section p');
        let backupMode = false;

        // Toggle between TOTP and backup code mode
        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            backupMode = !backupMode;
            codeInput.value = '';
            if (backupMode) {
                toggleLink.textContent = 'Use authenticator code instead';
                codeLabel.textContent = 'Backup Code';
                subtitleP.textContent = 'Enter one of your 8-character backup codes';
                codeInput.maxLength = 8;
                codeInput.placeholder = 'a3f1b92c';
                codeInput.inputMode = 'text';
                codeInput.pattern = '[0-9a-fA-F]{8}';
                codeInput.style.letterSpacing = '4px';
                codeInput.style.fontSize = '20px';
            } else {
                toggleLink.textContent = 'Lost your authenticator? Use a backup code';
                codeLabel.textContent = 'Verification Code';
                subtitleP.textContent = 'Enter the 6-digit code from your authenticator app';
                codeInput.maxLength = 6;
                codeInput.placeholder = '000000';
                codeInput.inputMode = 'numeric';
                codeInput.pattern = '[0-9]{6}';
                codeInput.style.letterSpacing = '8px';
                codeInput.style.fontSize = '24px';
            }
            codeInput.focus();
        });

        // Filter input based on mode
        codeInput.addEventListener('input', function() {
            if (backupMode) {
                this.value = this.value.replace(/[^0-9a-fA-F]/g, '').slice(0, 8).toLowerCase();
            } else {
                this.value = this.value.replace(/\D/g, '').slice(0, 6);
            }
        });

        // Auto-submit when expected length entered
        codeInput.addEventListener('input', function() {
            const expectedLen = backupMode ? 8 : 6;
            if (this.value.length === expectedLen) {
                tfaForm.dispatchEvent(new Event('submit', { cancelable: true }));
            }
        });

        tfaForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const code = codeInput.value.trim();
            alertContainer.innerHTML = '';

            const validTotp = code.length === 6 && /^\d{6}$/.test(code);
            const validBackup = code.length === 8 && /^[0-9a-f]{8}$/.test(code);
            if (!code || (!validTotp && !validBackup)) {
                showAlert(backupMode ? 'Please enter an 8-character backup code' : 'Please enter a 6-digit code', 'danger');
                return;
            }

            verifyBtn.disabled = true;
            verifyText.innerHTML = '<span class="spinner-border"></span>Verifying...';

            try {
                const response = await fetch('/auth/verify-2fa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ code })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.backup_used) {
                        showAlert(data.warning || 'Logged in with backup code.', 'success');
                        setTimeout(() => { window.location.href = '/'; }, 2500);
                    } else {
                        showAlert('Verified! Redirecting...', 'success');
                        setTimeout(() => { window.location.href = '/'; }, 500);
                    }
                } else if (data.locked) {
                    showAlert(data.error, 'danger');
                    setTimeout(() => { window.location.href = '/auth/login'; }, 2000);
                } else {
                    showAlert(data.error || 'Invalid code', 'danger');
                    codeInput.value = '';
                    codeInput.focus();
                    verifyBtn.disabled = false;
                    verifyText.innerHTML = 'Verify';
                }
            } catch (error) {
                showAlert('Connection error. Please try again.', 'danger');
                verifyBtn.disabled = false;
                verifyText.innerHTML = 'Verify';
            }
        });

        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert alert-' + type;
            alertDiv.textContent = message;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alertDiv);
        }
    </script>
</body>
</html>
