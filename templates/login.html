<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadInsights - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-primary: #e96304;
            --brand-neutral: #5E899E;
            --brand-success: #a8d5ba;
            --brand-bg: #fdfdfb;
            --brand-text-primary: #2c3e50;
            --brand-text-secondary: #5a6270;
        }

        body {
            background: linear-gradient(135deg, #f7fafc 0%, #e8f1f6 60%, var(--brand-bg) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--brand-text-primary);
            padding: 24px;
        }

        .login-container {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 18px 50px rgba(44, 62, 80, 0.15);
            border: 1px solid rgba(44, 62, 80, 0.08);
            padding: 42px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-mark {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            border-radius: 12px;
            object-fit: cover;
        }

        .logo-section h1 {
            color: var(--brand-text-primary);
            font-size: 28px;
            font-weight: 500;
            margin: 0;
        }
        
        .logo-section h1 span {
            font-weight: 400;
        }

        .logo-section p {
            color: var(--brand-text-secondary);
            font-size: 14px;
            margin: 5px 0 0 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            color: var(--brand-text-primary);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--brand-neutral);
            box-shadow: 0 0 0 0.2rem rgba(94, 137, 158, 0.2);
            outline: none;
        }

        .form-control::placeholder {
            color: #aaa;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .remember-forgot a {
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--brand-primary), #c75002);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(233, 99, 4, 0.25);
            color: white;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            color: var(--brand-text-secondary);
            font-size: 13px;
        }

        .signup-link {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .signup-link a {
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 44px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--brand-text-secondary);
            cursor: pointer;
            font-size: 16px;
        }

        .alert {
            border-radius: 8px;
            margin-bottom: 20px;
            border: none;
            padding: 12px 15px;
            font-size: 14px;
        }

        .alert-danger {
            background-color: #fee;
            color: #c00;
        }

        .alert-success {
            background-color: #efe;
            color: #060;
        }

        .spinner-border {
            width: 16px;
            height: 16px;
            margin-right: 8px;
        }

        .checkbox-remember {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .checkbox-remember input {
            cursor: pointer;
            margin-right: 8px;
        }

        @media (max-width: 576px) {
            .login-container {
                padding: 30px 20px;
                border-radius: 10px;
            }

            .logo-section h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <img src="https://res.cloudinary.com/dx7b7chvn/image/upload/v1769503548/frcr-rev-logo-transp_o2hmrq.png" alt="app-logo" class="logo-mark">
            <h1>RadInsights</h1>
            <p>Your Path to Fellowship Success</p>
        </div>

        <!-- Alert Messages -->
        <div id="alertContainer"></div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    class="form-control" 
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="password-field">
                <input 
                    type="password" 
                    id="password" 
                    class="form-control" 
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
                    <button type="button" class="toggle-password" data-target="password" aria-label="Show password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="remember-forgot">
                <label class="checkbox-remember">
                    <input type="checkbox" id="remember">
                    <span>Remember me</span>
                </label>
                <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span id="loginText">Sign In</span>
            </button>
        </form>

        <!-- Divider -->
        <div class="divider">
            Don't have an account?
        </div>

        <!-- Signup Link -->
        <div class="signup-link">
            <a href="{{ url_for('auth.register') }}">Create an account</a>
        </div>
        
        <!-- Legal Links -->
        <div class="text-center mt-3">
            <a href="{{ url_for('about') }}" class="text-muted small" style="text-decoration: none;">
                <i class="fas fa-info-circle me-1"></i>About
            </a>
            <span class="text-muted mx-2">|</span>
            <a href="{{ url_for('privacy_policy') }}" class="text-muted small" style="text-decoration: none;">
                <i class="fas fa-shield-alt me-1"></i>Privacy Policy
            </a>
            <span class="text-muted mx-2">|</span>
            <a href="{{ url_for('terms_of_use') }}" class="text-muted small" style="text-decoration: none;">
                <i class="fas fa-file-contract me-1"></i>Terms of Use
            </a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginText = document.getElementById('loginText');
        const alertContainer = document.getElementById('alertContainer');

        // Toggle password visibility
        document.querySelectorAll('.toggle-password').forEach((btn) => {
            btn.addEventListener('click', () => {
                const targetId = btn.getAttribute('data-target');
                const input = document.getElementById(targetId);
                if (!input) return;
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                btn.innerHTML = isPassword ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
            });
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            // Clear previous alerts
            alertContainer.innerHTML = '';

            // Validation
            if (!email || !password) {
                showAlert('Please fill in all fields', 'danger');
                return;
            }

            if (!email.includes('@')) {
                showAlert('Please enter a valid email', 'danger');
                return;
            }

            // Disable button and show loading
            loginBtn.disabled = true;
            loginText.innerHTML = '<span class="spinner-border"></span>Signing in...';

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',  // Required for Safari cookie handling
                    body: JSON.stringify({ email, password, remember })
                });

                let data = {};
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    try {
                        data = await response.json();
                    } catch (jsonError) {
                        console.error('JSON parse error:', jsonError);
                        showAlert('Invalid response from server. Please try again.', 'danger');
                        loginBtn.disabled = false;
                        loginText.innerHTML = 'Sign In';
                        return;
                    }
                } else {
                    // Non-JSON response (e.g. HTML error page, redirect)
                    const text = await response.text();
                    console.error('Non-JSON response:', text.substring(0, 200));
                    showAlert('Server error. Please try again.', 'danger');
                    loginBtn.disabled = false;
                    loginText.innerHTML = 'Sign In';
                    return;
                }

                if (response.ok) {
                    showAlert('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else if (data.account_deleted && data.recoverable) {
                    // Account is soft-deleted but recoverable - redirect to recovery page
                    const params = new URLSearchParams({
                        email: data.email || email,
                        deletion_date: data.deletion_date || 'Unknown',
                        days_remaining: data.days_remaining || 0
                    });
                    window.location.href = '/auth/account-deactivated?' + params.toString();
                } else if (data.account_deleted && !data.recoverable) {
                    // Account is permanently deleted
                    showAlert('This account has been permanently deleted and cannot be recovered.', 'danger');
                    loginBtn.disabled = false;
                    loginText.innerHTML = 'Sign In';
                } else {
                    showAlert(data.error || 'Login failed', 'danger');
                    loginBtn.disabled = false;
                    loginText.innerHTML = 'Sign In';
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Connection error. Please try again.', 'danger');
                loginBtn.disabled = false;
                loginText.innerHTML = 'Sign In';
            }
        });

        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `
                <i class="fas ${type === 'danger' ? 'fa-circle-exclamation' : 'fa-check-circle'}"></i>
                ${message}
            `;
            alertContainer.appendChild(alertDiv);

            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.style.transition = 'opacity 0.3s ease';
                    alertDiv.style.opacity = '0';
                    setTimeout(() => alertDiv.remove(), 300);
                }, 3000);
            }
        }
    </script>
</body>
</html>
