<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadInsights - Link Expired</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-primary: #e96304;
            --brand-neutral: #5E899E;
            --brand-bg: #fdfdfb;
            --brand-text-primary: #2c3e50;
            --brand-text-secondary: #5a6270;
        }

        body {
            background: linear-gradient(135deg, #f7fafc 0%, #e8f1f6 60%, var(--brand-bg) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--brand-text-primary);
            padding: 24px;
        }

        .expired-container {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 18px 50px rgba(44, 62, 80, 0.15);
            border: 1px solid rgba(44, 62, 80, 0.08);
            padding: 42px;
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-expired {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #fee 0%, #fdd 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }

        .icon-expired i {
            font-size: 36px;
            color: #d9534f;
        }

        h2 {
            color: var(--brand-text-primary);
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .message {
            color: var(--brand-text-secondary);
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-request {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--brand-primary), #c75002);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-request:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(233, 99, 4, 0.25);
            color: white;
        }

        .back-to-login {
            display: block;
            color: var(--brand-neutral);
            text-decoration: none;
            font-size: 14px;
            margin-top: 15px;
        }

        .back-to-login:hover {
            color: var(--brand-primary);
            text-decoration: underline;
        }

        .info-box {
            background-color: #f8f9fb;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 13px;
            color: var(--brand-text-secondary);
        }

        .info-box i {
            color: var(--brand-neutral);
            margin-right: 8px;
        }

        @media (max-width: 576px) {
            .expired-container {
                padding: 30px 20px;
            }

            h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="expired-container">
        <div class="icon-expired">
            <i class="fas fa-clock"></i>
        </div>
        
        <h2>Link Expired or Invalid</h2>
        
        <p class="message">
            This password reset link has expired or is invalid. 
            Password reset links are valid for 24 hours for security reasons.
        </p>
        
        <a href="/auth/forgot-password" class="btn-request">
            <i class="fas fa-envelope"></i> Request New Link
        </a>
        
        <a href="/auth/login" class="back-to-login">
            <i class="fas fa-arrow-left"></i> Back to Login
        </a>
        
        <div class="info-box">
            <i class="fas fa-info-circle"></i>
            If you continue to have problems, please contact support.
        </div>
    </div>
</body>
</html>
