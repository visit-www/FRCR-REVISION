{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-12">
            <h2 class="mb-4">Start Exam</h2>
            <p class="lead text-muted">Select an exam session and candidate to begin the examination.</p>
        </div>
    </div>

    <!-- Session Selection -->
    <div class="row mb-5">
        <div class="col-lg-8 mx-auto">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-calendar me-2"></i>Select Exam Session</h5>
                </div>
                <div class="card-body">
                    <div id="sessionsGrid" class="row g-3">
                        <div class="col-12">
                            <p class="text-muted">Loading sessions...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Candidates Selection (shown after session selection) -->
    <div id="candidatesSection" style="display: none;">
        <div class="row mb-5">
            <div class="col-lg-8 mx-auto">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-users me-2"></i>Select Candidate</h5>
                    </div>
                    <div class="card-body">
                        <div id="candidatesGrid" class="row g-3">
                            <!-- Candidates will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', loadSessions);

function loadSessions() {
    fetch('/api/exam/sessions')
        .then(r => r.json())
        .then(sessions => {
            if (!sessions || sessions.length === 0) {
                document.getElementById('sessionsGrid').innerHTML = '<div class="col-12"><p class="text-muted">No sessions available. Create one in Setup.</p></div>';
                return;
            }
            
            document.getElementById('sessionsGrid').innerHTML = sessions.map(session => `
                <div class="col-md-6">
                    <div class="card h-100 cursor-pointer" onclick="selectSession(${session.id}, '${session.session_name}')" style="cursor: pointer; transition: all 0.3s;">
                        <div class="card-body">
                            <h5 class="card-title">${session.session_name}</h5>
                            <p class="card-text">
                                <small class="text-muted">
                                    <i class="fas fa-calendar me-1"></i>${new Date(session.exam_date).toLocaleDateString()}<br>
                                    <i class="fas fa-clock me-1"></i>${session.exam_time}
                                </small>
                            </p>
                        </div>
                        <div class="card-footer bg-light">
                            <button class="btn btn-sm btn-primary w-100" onclick="selectSession(${session.id}, '${session.session_name}'); event.stopPropagation();">
                                <i class="fas fa-arrow-right me-1"></i>Select
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        });
}

function selectSession(sessionId, sessionName) {
    loadCandidates(sessionId, sessionName);
}

function loadCandidates(sessionId, sessionName) {
    fetch(`/api/candidates/${sessionId}`)
        .then(r => r.json())
        .then(candidates => {
            if (!candidates || candidates.length === 0) {
                document.getElementById('candidatesGrid').innerHTML = '<div class="col-12"><p class="text-muted">No candidates registered for this session.</p></div>';
            } else {
                document.getElementById('candidatesGrid').innerHTML = candidates.map(candidate => `
                    <div class="col-md-6">
                        <div class="card h-100 shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">${candidate.candidate_name}</h5>
                                <p class="card-text">
                                    <small class="text-muted">
                                        <i class="fas fa-id-badge me-1"></i>Candidate #${candidate.candidate_number}
                                    </small>
                                </p>
                            </div>
                            <div class="card-footer bg-light">
                                <a href="/view-packet/${candidate.id}" class="btn btn-sm btn-success w-100">
                                    <i class="fas fa-play me-1"></i>Start Exam
                                </a>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            
            document.getElementById('candidatesSection').style.display = 'block';
            document.getElementById('candidatesSection').scrollIntoView({behavior: 'smooth'});
        });
}
</script>

<style>
    .cursor-pointer {
        cursor: pointer;
    }
    
    .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(0,0,0,0.1) !important;
    }
</style>
{% endblock %}
