{% extends "base.html" %}
{% block title %}Edit: {{ doc.title }}{% endblock %}
{% block robots_meta %}<meta name="robots" content="noindex, nofollow">{% endblock %}

{% block content %}
<div class="container-fluid py-3" style="max-width: 1100px;">

<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h4 class="mb-0"><i class="fas fa-edit me-2" style="color: var(--brand-neutral);"></i>{{ doc.title }}</h4>
        <small class="text-muted">Slug: <code>{{ doc.slug }}</code> &middot; Category: <span class="badge" style="background: var(--brand-neutral); color: #fff;">{{ doc.category or 'general' }}</span></small>
    </div>
    <div class="d-flex gap-2">
        <button id="saveBtn" class="btn btn-sm btn-brand-primary"><i class="fas fa-save me-1"></i>Save</button>
        <a href="/api/admin/documents/{{ doc.slug }}/view" class="btn btn-sm btn-outline-secondary"><i class="fas fa-eye me-1"></i>View</a>
        <a href="/api/admin/docs-hub" class="btn btn-sm btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i>Docs Hub</a>
    </div>
</div>

<div id="saveStatus" class="d-none alert alert-sm py-1 px-3 mb-2" style="font-size: .85rem;"></div>

<!-- TinyMCE Editor -->
<div class="card border-0 shadow-sm">
    <div class="card-body p-2">
        <textarea id="docEditor">{{ doc.content_html | safe }}</textarea>
    </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const SLUG = '{{ doc.slug }}';

    tinymce.init({
        selector: '#docEditor',
        height: 600,
        menubar: 'edit view insert format tools',
        toolbar: 'undo redo | blocks | bold italic underline strikethrough | numlist bullist indent outdent | table link image code removeformat',
        plugins: 'table link image code autoresize lists',
        base_url: 'https://cdn.jsdelivr.net/npm/tinymce@6',
        relative_urls: false,
        convert_urls: false,
        remove_script_host: false,
        content_style: 'body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.6; padding: 12px; }',
        setup: function(editor) {
            editor.addShortcut('meta+s', 'Save document', function() {
                saveDocument();
            });
        }
    });

    function showStatus(msg, type) {
        const el = document.getElementById('saveStatus');
        el.className = 'alert py-1 px-3 mb-2 alert-' + type;
        el.textContent = msg;
        el.classList.remove('d-none');
        setTimeout(function() { el.classList.add('d-none'); }, 3000);
    }

    function saveDocument() {
        const editor = tinymce.get('docEditor');
        if (!editor) return;

        fetch('/api/admin/documents/' + SLUG, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content_html: editor.getContent() })
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                showStatus('Saved & synced to dev notes', 'success');
            } else {
                showStatus('Error: ' + (data.error || 'Unknown'), 'danger');
            }
        })
        .catch(err => showStatus('Network error: ' + err.message, 'danger'));
    }

    document.getElementById('saveBtn').addEventListener('click', saveDocument);
});
</script>
{% endblock %}
