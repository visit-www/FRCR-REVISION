<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadInsights - Forgot Password</title>
    <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/dx7b7chvn/image/upload/f_png,q_auto,w_32,h_32,c_fill/v1769503549/frcr-rev-logo-solid_wnltqf.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://res.cloudinary.com/dx7b7chvn/image/upload/f_png,q_auto,w_16,h_16,c_fill/v1769503549/frcr-rev-logo-solid_wnltqf.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-primary: #e96304;
            --brand-neutral: #5E899E;
            --brand-bg: #fdfdfb;
            --brand-text-primary: #2c3e50;
            --brand-text-secondary: #5a6270;
        }

        body {
            background: linear-gradient(135deg, #f7fafc 0%, #e8f1f6 60%, var(--brand-bg) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--brand-text-primary);
            padding: 24px;
        }

        .recovery-container {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 18px 50px rgba(44, 62, 80, 0.15);
            border: 1px solid rgba(44, 62, 80, 0.08);
            padding: 42px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-mark {
            width: 70px;
            height: 70px;
            margin-bottom: 15px;
            border-radius: 10px;
            object-fit: cover;
        }

        .header-section h2 {
            color: var(--brand-text-primary);
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .header-section p {
            color: var(--brand-text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            color: var(--brand-text-primary);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--brand-neutral);
            box-shadow: 0 0 0 0.2rem rgba(94, 137, 158, 0.2);
            outline: none;
        }

        .btn-send {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--brand-primary), #c75002);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(233, 99, 4, 0.25);
            color: white;
        }

        .btn-send:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--brand-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .alert {
            border-radius: 8px;
            margin-bottom: 20px;
            border: none;
            padding: 12px 15px;
            font-size: 14px;
        }

        .alert-danger {
            background-color: #fee;
            color: #c00;
        }

        .alert-success {
            background-color: #efe;
            color: #060;
        }

        .alert-info {
            background-color: #eef;
            color: #006;
        }

        .spinner-border {
            width: 16px;
            height: 16px;
            margin-right: 8px;
        }

        @media (max-width: 576px) {
            .recovery-container {
                padding: 30px 20px;
            }

            .header-section h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="recovery-container">
        <!-- Header Section -->
        <div class="header-section">
            <img src="https://res.cloudinary.com/dx7b7chvn/image/upload/f_auto,q_auto,w_300/v1769503548/frcr-rev-logo-transp_o2hmrq.png" alt="app-logo" class="logo-mark">
            <h2>Password Recovery</h2>
            <p>Enter your email address and we'll send you a link to reset your password.</p>
        </div>

        <!-- Alert Messages -->
        <div id="alertContainer"></div>

        <!-- Recovery Form -->
        <form id="recoveryForm">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    class="form-control" 
                    placeholder="Enter your registered email"
                    required
                    autocomplete="email"
                >
            </div>

            <button type="submit" class="btn-send" id="sendBtn">
                <span id="sendText">Send Recovery Email</span>
            </button>
        </form>

        <!-- Back Link -->
        <div class="back-link">
            <a href="{{ url_for('auth.login') }}">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>

    <script>
        const recoveryForm = document.getElementById('recoveryForm');
        const sendBtn = document.getElementById('sendBtn');
        const sendText = document.getElementById('sendText');
        const alertContainer = document.getElementById('alertContainer');

        recoveryForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();

            // Clear previous alerts
            alertContainer.innerHTML = '';

            // Validation
            if (!email) {
                showAlert('Please enter your email address', 'danger');
                return;
            }

            if (!email.includes('@')) {
                showAlert('Please enter a valid email address', 'danger');
                return;
            }

            // Disable button and show loading
            sendBtn.disabled = true;
            sendText.innerHTML = '<span class="spinner-border"></span>Sending...';

            try {
                const response = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email })
                });

                const data = await response.json();
                console.log('Response status:', response.status);
                console.log('Response data:', data);

                if (response.ok) {
                    showAlert(data.message || 'Recovery email sent! Check your inbox.', 'success');
                    document.getElementById('email').value = '';
                    // Re-enable button after success
                    sendBtn.disabled = false;
                    sendText.innerHTML = 'Send Recovery Email';
                } else {
                    console.error('Server error:', data);
                    showAlert(data.error || 'Failed to send recovery email', 'danger');
                    sendBtn.disabled = false;
                    sendText.innerHTML = 'Send Recovery Email';
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Connection error. Please try again.', 'danger');
                sendBtn.disabled = false;
                sendText.innerHTML = 'Send Recovery Email';
            }
        });

        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `
                <i class="fas ${
                    type === 'danger' ? 'fa-circle-exclamation' : 
                    type === 'success' ? 'fa-check-circle' : 
                    'fa-info-circle'
                }"></i>
                ${message}
            `;
            alertContainer.appendChild(alertDiv);

            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.style.transition = 'opacity 0.3s ease';
                    alertDiv.style.opacity = '0';
                    setTimeout(() => alertDiv.remove(), 300);
                }, 4000);
            }
        }
    </script>
    <!-- Google Analytics 4 (deferred to avoid blocking render) -->
    <script>
    window.addEventListener('load', function() {
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-ZSSC3PLZFN';
        s.async = true;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-ZSSC3PLZFN');
    });
    </script>
</body>
</html>
