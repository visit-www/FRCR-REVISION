<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRCR Examiner - Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #896b90;
            --secondary: #6c5b7f;
        }

        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .recovery-container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-section i {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .header-section h2 {
            color: var(--primary);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header-section p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            color: var(--secondary);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.2rem rgba(137, 107, 144, 0.25);
            outline: none;
        }

        .btn-send {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(137, 107, 144, 0.3);
            color: white;
        }

        .btn-send:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .alert {
            border-radius: 8px;
            margin-bottom: 20px;
            border: none;
            padding: 12px 15px;
            font-size: 14px;
        }

        .alert-danger {
            background-color: #fee;
            color: #c00;
        }

        .alert-success {
            background-color: #efe;
            color: #060;
        }

        .alert-info {
            background-color: #eef;
            color: #006;
        }

        .spinner-border {
            width: 16px;
            height: 16px;
            margin-right: 8px;
        }

        @media (max-width: 576px) {
            .recovery-container {
                padding: 30px 20px;
            }

            .header-section h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="recovery-container">
        <!-- Header Section -->
        <div class="header-section">
            <i class="fas fa-lock"></i>
            <h2>Password Recovery</h2>
            <p>Enter your email address and we'll send you a link to reset your password.</p>
        </div>

        <!-- Alert Messages -->
        <div id="alertContainer"></div>

        <!-- Recovery Form -->
        <form id="recoveryForm">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    class="form-control" 
                    placeholder="Enter your registered email"
                    required
                    autocomplete="email"
                >
            </div>

            <button type="submit" class="btn-send" id="sendBtn">
                <span id="sendText">Send Recovery Email</span>
            </button>
        </form>

        <!-- Back Link -->
        <div class="back-link">
            <a href="{{ url_for('auth.login') }}">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>

    <script>
        const recoveryForm = document.getElementById('recoveryForm');
        const sendBtn = document.getElementById('sendBtn');
        const sendText = document.getElementById('sendText');
        const alertContainer = document.getElementById('alertContainer');

        recoveryForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();

            // Clear previous alerts
            alertContainer.innerHTML = '';

            // Validation
            if (!email) {
                showAlert('Please enter your email address', 'danger');
                return;
            }

            if (!email.includes('@')) {
                showAlert('Please enter a valid email address', 'danger');
                return;
            }

            // Disable button and show loading
            sendBtn.disabled = true;
            sendText.innerHTML = '<span class="spinner-border"></span>Sending...';

            try {
                const response = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert(data.message || 'Recovery email sent! Check your inbox.', 'success');
                    document.getElementById('email').value = '';
                    setTimeout(() => {
                        // Keep user on page so they can see the message
                    }, 2000);
                } else {
                    showAlert(data.error || 'Failed to send recovery email', 'danger');
                    sendBtn.disabled = false;
                    sendText.innerHTML = 'Send Recovery Email';
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Connection error. Please try again.', 'danger');
                sendBtn.disabled = false;
                sendText.innerHTML = 'Send Recovery Email';
            }
        });

        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `
                <i class="fas ${
                    type === 'danger' ? 'fa-circle-exclamation' : 
                    type === 'success' ? 'fa-check-circle' : 
                    'fa-info-circle'
                }"></i>
                ${message}
            `;
            alertContainer.appendChild(alertDiv);

            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.style.transition = 'opacity 0.3s ease';
                    alertDiv.style.opacity = '0';
                    setTimeout(() => alertDiv.remove(), 300);
                }, 4000);
            }
        }
    </script>
</body>
</html>
