name: Create Release with Distribution Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Get version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi
        
    - name: Create Windows distribution package
      run: |
        mkdir -p release-packages
        
        # Create Windows ZIP
        cd ${{ github.workspace }}
        zip -r release-packages/FRCR-Examiner-Windows-${{ steps.get_version.outputs.VERSION }}.zip \
          app.py \
          models.py \
          backup_*.py \
          requirements.txt \
          Procfile \
          README.md \
          HOW_TO_USE.md \
          CHANGELOG.md \
          CONTRIBUTING.md \
          templates/ \
          static/ \
          dist/windows/ \
          dist/icons/ \
          dist/INSTALLATION_GUIDE.md \
          dist/QUICK_START.md \
          dist/RELEASE_NOTES.md \
          -x "**/__pycache__/*" "**/*.pyc" "**/.DS_Store" "**/instance/*" "**/backups/*"
          
    - name: Create macOS distribution package
      run: |
        # Create macOS ZIP
        cd ${{ github.workspace }}
        zip -r release-packages/FRCR-Examiner-macOS-${{ steps.get_version.outputs.VERSION }}.zip \
          app.py \
          models.py \
          backup_*.py \
          requirements.txt \
          Procfile \
          README.md \
          HOW_TO_USE.md \
          CHANGELOG.md \
          CONTRIBUTING.md \
          templates/ \
          static/ \
          dist/macos/ \
          dist/icons/ \
          dist/INSTALLATION_GUIDE.md \
          dist/QUICK_START.md \
          dist/RELEASE_NOTES.md \
          -x "**/__pycache__/*" "**/*.pyc" "**/.DS_Store" "**/instance/*" "**/backups/*"
    
    - name: Generate checksums
      run: |
        cd release-packages
        sha256sum *.zip > checksums.txt
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        name: FRCR Examiner Tool ${{ steps.get_version.outputs.VERSION }}
        body_path: dist/RELEASE_NOTES.md
        draft: false
        prerelease: false
        files: |
          release-packages/*.zip
          release-packages/checksums.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
