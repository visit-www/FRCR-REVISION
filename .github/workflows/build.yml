name: Build Electron Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            artifact: FRCR\ Examiner-*.dmg
            artifact-pattern: FRCR Examiner-*.dmg
          - os: windows-latest
            artifact: FRCR\ Examiner\ Setup\ *.exe
            artifact-pattern: FRCR Examiner Setup *.exe
          - os: ubuntu-latest
            artifact: FRCR-Examiner-*.AppImage
            artifact-pattern: FRCR-Examiner-*.AppImage

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build on macOS
        if: runner.os == 'macOS'
        run: npm run build-mac

      - name: Build on Windows
        if: runner.os == 'Windows'
        run: npm run build-win

      - name: Build on Linux
        if: runner.os == 'Linux'
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.os }}-installer
          path: dist/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
