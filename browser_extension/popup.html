<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .header img {
      width: 32px;
      height: 32px;
      margin-right: 12px;
    }
    
    .header h1 {
      font-size: 16px;
      margin: 0;
      color: #333;
    }
    
    .status-card {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    
    .status-card.success {
      background: #e8f5e9;
      border: 1px solid #4CAF50;
    }
    
    .status-card.warning {
      background: #fff3e0;
      border: 1px solid #ff9800;
    }
    
    .status-card.error {
      background: #ffebee;
      border: 1px solid #f44336;
    }
    
    .status-icon {
      font-size: 24px;
      margin-right: 8px;
    }
    
    .status-text {
      font-size: 14px;
      font-weight: 500;
    }
    
    .status-detail {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s;
    }
    
    .btn-primary {
      background: #1976d2;
      color: white;
    }
    
    .btn-primary:hover {
      background: #1565c0;
    }
    
    .btn-secondary {
      background: #f5f5f5;
      color: #333;
      border: 1px solid #ddd;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    .info {
      font-size: 11px;
      color: #888;
      margin-top: 12px;
      text-align: center;
    }
    
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="AJCC Sync">
    <h1>AJCC Cookie Sync</h1>
  </div>
  
  <div id="statusCard" class="status-card warning">
    <div style="display: flex; align-items: center;">
      <span id="statusIcon" class="status-icon">⏳</span>
      <div>
        <div id="statusText" class="status-text">Checking status...</div>
        <div id="statusDetail" class="status-detail"></div>
      </div>
    </div>
  </div>
  
  <div class="actions">
    <button id="syncBtn" class="btn-primary">
      <span>🔄</span> Sync Cookies Now
    </button>
    <button id="loginBtn" class="btn-secondary">
      <span>🔐</span> Open AJCC Login
    </button>
  </div>
  
  <div class="info">
    Cookies are automatically synced when you log in to AJCC.
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
